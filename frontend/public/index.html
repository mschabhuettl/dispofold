<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispofold</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.css">
  <link rel="stylesheet" href="vendor/bryntum/scheduler.css">
  <link rel="stylesheet" href="vendor/bryntum/svalbard-light.css" id="bryntum-theme">
  <link rel="stylesheet" href="css/app.css">
  <script src="theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-t="app.skipLink"></a>
  <div class="layout">
    <nav class="sidebar" data-t-aria-label="app.mainNav">
      <div class="brand">
        <img src="img/logo.svg" alt="">
        <p class="app-name" data-t="app.name"></p>
      </div>
      <ul id="nav"></ul>
      <a class="source-link" href="https://github.com/mschabhuettl/dispofold" target="_blank" rel="noopener"
         data-t="app.source"></a>
    </nav>
    <div class="content">
      <header class="topbar">
        <div class="month-picker">
          <button class="btn-icon" id="month-prev" type="button" data-t-aria-label="app.monthPrev">&#8249;</button>
          <label class="visually-hidden" for="month" data-t="app.monthLabel"></label>
          <select id="month"></select>
          <button class="btn-icon" id="month-next" type="button" data-t-aria-label="app.monthNext">&#8250;</button>
        </div>
        <div class="user">
          <span id="user-name"></span>
          <span id="user-role" class="badge"></span>
          <button class="btn-icon theme-toggle" type="button"></button>
          <button class="btn btn-secondary btn-small" id="logout" type="button" data-t="app.logout" hidden></button>
          <button class="btn btn-secondary btn-small" id="quit" type="button" data-t="desktop.quit" hidden></button>
        </div>
      </header>
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="restart-status" class="banner" role="status" hidden data-t="desktop.restarting"></div>
      <div id="toast" class="toast" hidden></div>
      <div id="live" class="visually-hidden" role="status" aria-live="polite"></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
