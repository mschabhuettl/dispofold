# Documentation site from docs/*.md, README.md (start page) and the plugins' help pages, built with Zensical by
# tools/docs/build.py, which assembles the pages first:
#   pip install -r tools/docs/requirements.txt && python tools/docs/build.py    (output in site/, not committed)
site_name: Dispofold
site_description: Dienstplanung für Leitstellen
site_url: https://mschabhuettl.github.io/dispofold/
repo_url: https://github.com/mschabhuettl/dispofold
repo_name: dispofold
edit_uri: ""
copyright: Dispofold steht unter der AGPL-3.0.
docs_dir: docs

nav:
  - Start: index.md
  - Anleitung:
      - Schnellstart in 10 Schritten: anleitung/schnellstart.md
      - Überblick: anleitung/index.md
      - Erste Schritte: anleitung/erste-schritte.md
      - Ein Monat Schritt für Schritt: anleitung/beispiel.md
      - Was die Zahlen bedeuten: anleitung/zahlen.md
      - Wie das Programm plant: anleitung/wie-plant.md
      - Personen: anleitung/personen.md
      - Bereiche, Schichten und Bedarf: anleitung/stammdaten.md
      - Abwesenheiten, Wünsche und Vorgaben: anleitung/eingaben.md
      - Planen und Prüfen: anleitung/planen.md
      - Plan bearbeiten: anleitung/plan-bearbeiten.md
      - Auswertungen: anleitung/auswertungen.md
      - Monat abschließen: anleitung/monatsabschluss.md
      - Daten und Korrekturdatei: anleitung/daten.md
      - Regeln einstellen: anleitung/einstellungen.md
      - Updates: anleitung/updates.md
      - Erweiterungen: anleitung/erweiterungen.md
      - Rolle „nur lesen“: anleitung/nur-lesen.md
      - Häufige Fragen und Fehlerbehebung: anleitung/fragen.md
      - Begriffe: anleitung/begriffe.md
  - Regeln: regeln.md
  - Betrieb: betrieb.md
  - Desktop: desktop.md
  - Datenformat: datenformat.md
  - Entwicklung:
      - API: api.md
      - Erweiterungen entwickeln: plugins.md
      - Release: release.md
      - Code signing policy: code-signing-policy.md

theme:
  name: material
  language: de
  # system fonts: the site loads nothing from font services
  font: false
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dunkel
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Hell

plugins:
  - search

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      # anchors as on GitHub (umlauts kept), so the links in the Markdown files work in both places
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# tools/docs/build.py builds with --strict: a link to a missing page or anchor fails the build. Of this block Zensical
# reads only the anchors; the script itself checks images, other files and pages missing from the navigation.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
