# HTTP
quarkus.http.port=8080
quarkus.http.test-port=0
# Same as client_max_body_size in the frontend's nginx.conf
quarkus.http.limits.max-body-size=50M

# Database (PostgreSQL). Tests and dev mode start a container through Dev Services.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://db:5432/dienstplanung}
%prod.quarkus.datasource.username=${DB_USER:dienstplanung}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.flyway.migrate-at-start=true

# Solver defaults for POST /api/plans/{month}/solve
app.solver.time-limit-seconds=${SOLVER_TIME_LIMIT_SECONDS:300}
app.solver.unimproved-seconds=${SOLVER_UNIMPROVED_SECONDS:30}
app.solver.seed=${SOLVER_SEED:1}
# Stop after this many moves: the same data and seed give the same plan (0: time limit only, not reproducible).
# The time limit is a safety net.
app.solver.move-limit=${SOLVER_MOVE_LIMIT:250000}
# The solver configuration is built in code; keep the extension quiet.
quarkus.log.category."ai.timefold.solver".level=WARN

# Logging: no request bodies, only internal ids in messages
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Login: form authentication with users from APP_USERS (user:bcrypt-hash:role,...; see AppUsers).
# Test users: planer/planpw, leser/geheim.
app.users=${APP_USERS:}
%test.app.users=planer:$2b$04$iCj70OyOjOM3M./1DkDrOuWSMZ6Tl9QAtGjxatohuHZeMs0eOr6fO:planner,leser:$2b$04$WX7g7BYFZQ4/hQ3hPH40QO2EsAIh0b8Px8ZTrJGXAgNAEXtne5Fe.:viewer
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.html
quarkus.http.auth.form.landing-page=/
quarkus.http.auth.form.error-page=/login.html?error=1
quarkus.http.auth.form.timeout=PT2H
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
# Without a fixed key every restart ends all sessions. The server build refuses to start without a proper key
# (at least 32 characters, no placeholder) or with a placeholder database password, see StartupChecks.
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:}
%test.quarkus.http.auth.session.encryption-key=test-only-session-key-0123456789abcdef

# The login page's hashed scripts (/theme-<hash>.js, /js/login-<hash>.js) are opened by PageAccessPolicy.
quarkus.http.auth.permission.public.paths=/login.html,/css/*,/fonts/*,/img/*,/favicon.ico,/favicon.svg,/q/health/*
quarkus.http.auth.permission.public.policy=permit
# The REST API is protected by annotations so that it answers 401 instead of a redirect.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=permit
quarkus.http.auth.permission.pages.paths=/*
quarkus.http.auth.permission.pages.policy=pages
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Behind the frontend's web server (and possibly a TLS proxy): honour X-Forwarded-* for redirects.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Desktop build (./mvnw package -Dquarkus.profile=desktop, see docs/desktop.md): encrypted H2 file database,
# loopback only, no form login, no X-Forwarded-* trust. The launcher passes dispofold.data-dir,
# dispofold.versions-dir and quarkus.http.port; DesktopMain sets password and token from stdin.
%desktop.quarkus.datasource.db-kind=h2
%desktop.quarkus.datasource.jdbc.url=jdbc:h2:file:${dispofold.data-dir}/db/dispofold;CIPHER=AES
%desktop.quarkus.datasource.username=sa
%desktop.quarkus.datasource.password=${dispofold.desktop.db-password}
%desktop.quarkus.http.host=127.0.0.1
%desktop.quarkus.http.auth.form.enabled=false
%desktop.quarkus.http.proxy.proxy-address-forwarding=false
%desktop.quarkus.http.proxy.allow-x-forwarded=false
%desktop.quarkus.http.proxy.enable-forwarded-host=false
# stdout carries the line protocol to the launcher (ReadyLine); the log goes to stderr.
%desktop.quarkus.log.console.stderr=true
# Update bundles are uploaded through POST /api/desktop/update/file; BodyLimit keeps every other path at 50M.
%desktop.quarkus.http.limits.max-body-size=1024M
