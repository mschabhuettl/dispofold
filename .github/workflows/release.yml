name: Release

on:
  push:
    tags: ["v*"]

# One release run at a time per repository; a second tag waits.
concurrency:
  group: release
  cancel-in-progress: false

# Read only by default; the publishing jobs ask for more.
permissions:
  contents: read

# Repository settings (see docs/release.md):
#   vars.REGISTRY          registry/namespace to push the images to; without it, no push (the archive is enough)
#   vars.API_URL           API address for uploads, if the default one must not be used for large files
#   vars.MACOS_RUNNER      runner label for the macOS dmg (desktop-packages.yml); without it, GitHub's macos-15
#   secrets.RELEASE_TOKEN  token for the registry and the release; without it, the job token is used
#   secrets.UPDATE_SIGNING_KEY  private Ed25519 key for the update bundle; required, the release fails without it
#   vars.SIGNPATH_ORGANIZATION_ID  switches on the Windows signature with SignPath; without it, nothing changes.
#     With it also: secrets.SIGNPATH_API_TOKEN, vars.SIGNPATH_PROJECT_SLUG, vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG,
#     optionally vars.SIGNPATH_SIGNING_POLICY_SLUG (default release-signing)
# Secrets are passed only to the single steps that need them.
env:
  REGISTRY: ${{ vars.REGISTRY }}
  API: ${{ vars.API_URL || github.api_url }}
  UPLOAD_ORIGIN: ${{ vars.API_URL }}

jobs:
  version:
    # Only plain vMAJOR.MINOR.PATCH tags are released; the version goes into every build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # All checks of the CI must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    # The release exists only as a draft until every job below has uploaded its files.
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Draft release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" create

  images:
    needs: [version, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # The cache of the CI job compose. Before the version is written into pom.xml, so that the key matches.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: maven-image-seed-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: setup-java-${{ runner.os }}-
      - name: Cache of the Maven of the wrapper (a download per job failed now and then)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven of the wrapper (with retries)
        run: scripts/fetch-maven.sh
      - name: Maven repository for the image build
        # The backend image build starts from it (MAVEN_SEED): Maven Central limits the requests per address, and
        # the image build on a fresh runner would fetch the whole tree. Resolves what that build does.
        working-directory: backend
        run: ./mvnw -B dependency:go-offline package -DskipTests
      # arm64: only the last stage of the images runs emulated (the application is built natively)
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Registry login
        if: env.REGISTRY != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: echo "$RELEASE_TOKEN" | docker login "${REGISTRY%%/*}" -u "${{ github.repository_owner }}" --password-stdin
      # amd64 and arm64 one after the other: each is built, saved into its archive and pushed under its own tags
      - name: Images for amd64
        run: |
          MAVEN_SEED="$HOME/.m2/repository" ARCH=amd64 scripts/release/build-images.sh "$VERSION"
          ARCH=amd64 scripts/release/save-images.sh "$VERSION" release-assets
          if [ -n "$REGISTRY" ]; then scripts/release/push-images.sh "$VERSION" "$REGISTRY" amd64; fi
      - name: Images for arm64
        run: |
          MAVEN_SEED="$HOME/.m2/repository" ARCH=arm64 scripts/release/build-images.sh "$VERSION"
          docker image inspect -f '{{.Architecture}}' "dispofold.invalid/dispofold-backend:$VERSION" | grep -qx arm64
          ARCH=arm64 scripts/release/save-images.sh "$VERSION" release-assets
          if [ -n "$REGISTRY" ]; then scripts/release/push-images.sh "$VERSION" "$REGISTRY" arm64; fi
      - name: One name for both platforms in the registry
        if: env.REGISTRY != ''
        run: scripts/release/push-images.sh "$VERSION" "$REGISTRY" manifest
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  desktop-linux:
    needs: [version, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache of the Maven of the wrapper (a download per job failed now and then)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven of the wrapper (with retries)
        run: scripts/fetch-maven.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Packaging tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf rpm file zip
      - name: deb and rpm
        run: scripts/desktop/package.sh "$VERSION" linux release-assets
      - name: Signed update bundle
        # Required: a release without an update bundle fails. The key reaches only this step.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/desktop/update-bundle.sh "$VERSION" release-assets
      - name: Update bundle verifies against the key compiled into the program
        run: scripts/desktop/verify-bundle.sh "release-assets/dispofold-$VERSION-update.zip"
      - name: SHA-256
        run: cd release-assets && sha256sum -- * > "dispofold-$VERSION-linux-SHA256SUMS.txt"
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  desktop-windows:
    # Cross-built on Linux, so every platform's Linux runner builds the same artefacts.
    needs: [version, draft]
    runs-on: ubuntu-latest
    # With SignPath the job waits for the approval of the signing request
    timeout-minutes: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 180 || 60 }}
    permissions:
      contents: write
      actions: read # SignPath reads the unsigned files of this run (only with signing)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache of the Maven of the wrapper (a download per job failed now and then)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Maven of the wrapper (with retries)
        run: scripts/fetch-maven.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Cross-build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq clang lld llvm nsis zip unzip
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Setup and portable ZIP
        run: scripts/desktop/package.sh "$VERSION" windows release-assets
      # Optional Windows signature with SignPath (docs/release.md); without SIGNPATH_ORGANIZATION_ID these steps
      # are skipped. The update bundle holds no Windows programs and keeps its own signature (desktop-linux).
      - name: Unsigned files for SignPath
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Signing request (waits for the approval in SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Signed files replace the unsigned ones
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          [ "$(ls signed)" = "$(ls release-assets)" ] || { echo "SignPath returned other files:"; ls signed; exit 1; }
          python3 -I - "signed/Dispofold-$VERSION-windows-setup.exe" "signed/Dispofold-$VERSION-windows-portable.zip" <<'PY'
          import struct, sys, zipfile
          def signed(data):  # size of the PE security directory (Authenticode signature)
              pe = struct.unpack_from("<I", data, 0x3C)[0]
              optional = pe + 24
              dirs = optional + (96 if struct.unpack_from("<H", data, optional)[0] == 0x10B else 112)
              return struct.unpack_from("<I", data, dirs + 4 * 8 + 4)[0] > 0
          setup, portable = sys.argv[1:]
          files = {setup: open(setup, "rb").read(),
                   portable + ":Dispofold/dispofold.exe": zipfile.ZipFile(portable).read("Dispofold/dispofold.exe")}
          unsigned = [name for name, data in files.items() if not signed(data)]
          sys.exit(f"not signed: {unsigned}" if unsigned else 0)
          PY
          cp signed/* release-assets/
      - name: SHA-256
        run: cd release-assets && sha256sum -- * > "dispofold-$VERSION-windows-SHA256SUMS.txt"
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  desktop-arm:
    # macOS for Apple Silicon and Linux arm64: built, installed and self-tested on their own runners
    needs: [version, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
    secrets: inherit

  publish:
    # Publishes the draft only when every upload job succeeded.
    needs: [images, desktop-linux, desktop-windows, desktop-arm]
    if: >-
      always() && needs.images.result == 'success' && needs.desktop-linux.result == 'success'
      && needs.desktop-windows.result == 'success' && needs.desktop-arm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" publish

  pages:
    # The documentation site of the released version on GitHub Pages, only after the release is published.
    # Needs Settings, Pages, Source "GitHub Actions" (see docs/release.md).
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          pip install -r tools/docs/requirements.txt
          python tools/docs/build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
