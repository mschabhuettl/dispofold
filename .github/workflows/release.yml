name: Release

on:
  push:
    tags: ["v*"]

# One release run at a time per repository; a second tag waits.
concurrency:
  group: release
  cancel-in-progress: false

# Read only by default; the publishing jobs ask for more.
permissions:
  contents: read

# Repository settings (see docs/release.md):
#   vars.REGISTRY          registry/namespace to push the images to; without it, no push (the archive is enough)
#   vars.API_URL           API address for uploads, if the default one must not be used for large files
#   vars.MACOS_RUNNER      runner label for the macOS installer; without it, the job is skipped
#   secrets.RELEASE_TOKEN  token for the registry and the release; without it, the job token is used
#   secrets.UPDATE_SIGNING_KEY  private Ed25519 key for the update bundle; required, the release fails without it
# Secrets are passed only to the single steps that need them.
env:
  REGISTRY: ${{ vars.REGISTRY }}
  API: ${{ vars.API_URL || github.api_url }}
  UPLOAD_ORIGIN: ${{ vars.API_URL }}

jobs:
  version:
    # Only plain vMAJOR.MINOR.PATCH tags are released; the version goes into every build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # All checks of the CI must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    # The release exists only as a draft until every job below has uploaded its files.
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Draft release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" create

  images:
    needs: [version, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Build images
        run: scripts/release/build-images.sh "$VERSION"
      - name: Image archive with SHA-256
        run: scripts/release/save-images.sh "$VERSION" release-assets
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets
      - name: Push images
        if: env.REGISTRY != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          echo "$RELEASE_TOKEN" | docker login "${REGISTRY%%/*}" -u "${{ github.repository_owner }}" --password-stdin
          scripts/release/push-images.sh "$VERSION" "$REGISTRY"

  desktop-linux:
    needs: [version, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Packaging tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf rpm file zip
      - name: deb and rpm
        run: scripts/desktop/package.sh "$VERSION" linux release-assets
      - name: Signed update bundle
        # Required: a release without an update bundle fails. The key reaches only this step.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/desktop/update-bundle.sh "$VERSION" release-assets
      - name: Update bundle verifies against the key compiled into the program
        run: scripts/desktop/verify-bundle.sh "release-assets/dispofold-$VERSION-update.zip"
      - name: SHA-256
        run: cd release-assets && sha256sum -- * > "dispofold-$VERSION-linux-SHA256SUMS.txt"
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  desktop-windows:
    # Cross-built on Linux, so every platform's Linux runner builds the same artefacts.
    needs: [version, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: Cross-build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq clang lld llvm nsis zip unzip
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Setup and portable ZIP
        run: scripts/desktop/package.sh "$VERSION" windows release-assets
      - name: SHA-256
        run: cd release-assets && sha256sum -- * > "dispofold-$VERSION-windows-SHA256SUMS.txt"
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  desktop-macos:
    if: vars.MACOS_RUNNER != ''
    needs: [version, draft]
    runs-on: ${{ vars.MACOS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Version into the builds
        run: scripts/release/set-version.sh "$GITHUB_REF_NAME"
      - name: dmg
        run: scripts/desktop/package.sh "$VERSION" macos release-assets
      - name: SHA-256
        run: cd release-assets && shasum -a 256 -- * > "dispofold-$VERSION-macos-SHA256SUMS.txt"
      - name: Upload to the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" upload release-assets

  publish:
    # Publishes the draft only when every upload job succeeded (the macOS job may be skipped).
    needs: [images, desktop-linux, desktop-windows, desktop-macos]
    if: >-
      always() && needs.images.result == 'success' && needs.desktop-linux.result == 'success'
      && needs.desktop-windows.result == 'success'
      && (needs.desktop-macos.result == 'success' || needs.desktop-macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish the release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: scripts/release/publish-release.sh "$API" "${{ github.repository }}" "$GITHUB_REF_NAME" publish
