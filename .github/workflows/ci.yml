name: CI

on:
  push:
    # Tags run the same checks inside the release workflow.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Data files and repository hygiene
        run: scripts/check-repo.sh
      - name: OCR tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng librsvg2-bin python3-pil fonts-dejavu-core
      - name: Text in images
        run: |
          scripts/test-check-images.sh
          scripts/check-images.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, constraint and API tests
        working-directory: backend
        run: ./mvnw -B test

  backend-h2:
    # The desktop build uses an encrypted H2 file database; the same suite runs against it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests on H2
        working-directory: backend
        run: >
          ./mvnw -B test -Dquarkus.datasource.db-kind=h2 -Dquarkus.datasource.devservices.enabled=false
          "-Dquarkus.datasource.jdbc.url=jdbc:h2:mem:dispofold;DB_CLOSE_DELAY=-1;CIPHER=AES"
          "-Dquarkus.datasource.password=filepw userpw" -Dquarkus.datasource.username=sa

  solver-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Solve the synthetic demo month (150 people) within 5 minutes
        working-directory: backend
        run: ./mvnw -B test -Dtest=DemoSolveTest -Dsolver.longTest=true

  demo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test tools
        working-directory: tools/demodata
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: tools/demodata
        run: ruff check .
      - name: Tests
        working-directory: tools/demodata
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  desktop-shell:
    # Unit tests of the program window (protocol, proof, proxy rules).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf rpm file zip xvfb xauth dbus-x11
      - name: Window tests
        working-directory: desktop-shell
        run: cargo test --locked

  desktop-linux:
    # Builds the Linux packages, then the desktop end-to-end check and the browser front end check on them.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build dependencies
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf rpm file zip xvfb xauth dbus-x11
      - name: deb and rpm
        run: scripts/desktop/package.sh 0.0.0 linux desktop-out
      - name: Desktop end-to-end check
        # Part 1: the window self-test of this deb (start, demo data, planning, export, quit). Part 2: launcher
        # scenarios (signed update with a throwaway key, tampered bundle, rollback, passwords, refused requests).
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get install -y -qq jq curl unzip rsync
          DISPOFOLD_E2E_DEB="$PWD/desktop-out/Dispofold-0.0.0-linux-amd64.deb" backend/src/test/desktop/e2e.sh
      - name: Extract the deb
        run: mkdir -p st && dpkg-deb -x desktop-out/Dispofold-0.0.0-linux-amd64.deb st/root
      - name: Browser front end (Linux default) through the launch file and the proxy
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          scripts/desktop/check-browser-mode.sh st/root

  windows-build:
    # Only where hosted Windows runners exist (variable WINDOWS_TEST): the Windows setup is cross-built on Linux as in the release, then tested
    # on a hosted Windows runner. Nothing is published.
    if: vars.WINDOWS_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust
        run: |
          command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cross-build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq clang lld llvm nsis zip unzip
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Setup and portable ZIP
        run: scripts/desktop/package.sh 0.0.0 windows windows-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-setup
          path: windows-out/Dispofold-0.0.0-windows-setup.exe
          retention-days: 1

  windows-test:
    if: vars.WINDOWS_TEST == 'true'
    needs: [windows-build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-setup
      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru .\Dispofold-0.0.0-windows-setup.exe -ArgumentList '/S'
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
      - name: Start, load demo data, plan, export, quit
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Dispofold\dispofold.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Dispofold') | Select-Object -First 30; throw "not installed: $exe" }
          $p = Start-Process -Wait -PassThru $exe -ArgumentList '--selftest',"$pwd\result.json",'--data',"$pwd\data"
          Get-Content result.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, demo-data, frontend]
    env:
      # Own project name and a random host port, so that runs do not collide on a shared Docker host.
      COMPOSE_PROJECT_NAME: dispofold-ci-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
      HTTP_PORT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and start the stack
        run: |
          read -r CI_USER CI_PASSWORD < <(scripts/make-env.sh "ci-${{ github.run_id }}")
          echo "::add-mask::$CI_PASSWORD"
          printf 'CI_USER=%s\nCI_PASSWORD=%s\n' "$CI_USER" "$CI_PASSWORD" >> "$GITHUB_ENV"
          docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test
        # Runs inside the stack's network: on a runner whose jobs are containers, localhost is not the host.
        run: |
          docker run --rm -i -e CI_USER -e CI_PASSWORD --network "${COMPOSE_PROJECT_NAME}_default" \
            alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f \
            sh -c 'apk add -q --no-cache bash curl && bash -s http://frontend:8080 "$CI_USER" "$CI_PASSWORD"' < scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: |
          docker compose down -v
          docker image rm "dispofold.invalid/dispofold-backend:ci-${{ github.run_id }}" \
            "dispofold.invalid/dispofold-frontend:ci-${{ github.run_id }}"
