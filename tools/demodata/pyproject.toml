[project]
name = "demodata"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Synthetic demo data generator for the duty planning"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
