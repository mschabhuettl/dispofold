name: dispofold

services:
  db:
    # The release archive brings this image under its own name (POSTGRES_IMAGE in its env.example).
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dienstplanung}
      POSTGRES_USER: ${DB_USER:-dienstplanung}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${REGISTRY:-dispofold.invalid}/dispofold-backend:${TAG:?TAG fehlt in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dienstplanung}
      DB_USER: ${DB_USER:-dienstplanung}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY fehlt in .env}
      APP_USERS: ${APP_USERS:?APP_USERS fehlt in .env}
      SOLVER_TIME_LIMIT_SECONDS: ${SOLVER_TIME_LIMIT_SECONDS:-300}
      SOLVER_UNIMPROVED_SECONDS: ${SOLVER_UNIMPROVED_SECONDS:-30}
      SOLVER_SEED: ${SOLVER_SEED:-1}
      SOLVER_MOVE_LIMIT: ${SOLVER_MOVE_LIMIT:-250000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    image: ${REGISTRY:-dispofold.invalid}/dispofold-frontend:${TAG:?TAG fehlt in .env}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login.html"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
