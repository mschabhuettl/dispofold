<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispofold</title>
  <link rel="stylesheet" href="/__shell/shell.css">
  <script src="/__shell/unlock.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/__shell/icon.svg" alt=""><span>Dispofold</span></div>
    <form id="form" novalidate>
      <h1 id="title">Dispofold entsperren</h1>
      <p id="intro">Bitte das Passwort für die Daten eingeben.</p>
      <p id="first" class="note" hidden>Die Daten werden mit diesem Passwort verschlüsselt. Ohne das Passwort sind
        die Daten verloren: Es gibt keine Möglichkeit, es wiederherzustellen. Bitte sicher aufbewahren.</p>
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="off" required autofocus>
      <div id="repeat-row" hidden>
        <label for="repeat">Passwort wiederholen</label>
        <input id="repeat" type="password" autocomplete="off">
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <button id="submit" type="submit">Entsperren</button>
    </form>
  </main>
</body>
</html>
