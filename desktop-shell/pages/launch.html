<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispofold</title>
  <link rel="stylesheet" href="/__shell/shell.css">
  <script src="/__shell/launch.js" defer></script>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="brand"><img src="/__shell/icon.svg" alt=""><span>Dispofold</span></div>
    <div id="busy">
      <h1>Dispofold wird geöffnet</h1>
      <div class="spinner" role="progressbar" aria-label="Dispofold wird geöffnet"></div>
    </div>
    <div id="expired" hidden>
      <h1>Bitte Dispofold neu starten</h1>
      <p>Dieser Startlink ist abgelaufen oder wurde schon verwendet. Ein neuer Start von Dispofold öffnet das
        Programm wieder im Browser.</p>
    </div>
  </main>
</body>
</html>
